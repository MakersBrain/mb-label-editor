# SPDX-License-Identifier: AGPL-3.0-or-later
name: Deploy hosted PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mb-label-editor } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: mb-label-editor }
      - id: sdk
        # The editor builds against a merged SDK commit, never a moving branch,
        # so a change that spans both repositories lands in the SDK first.
        run: echo "ref=$(tr -d '[:space:]' < .github/sdk-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MakersBrain/mb-printer-sdk
          path: mb-printer-sdk
          ref: '${{ steps.sdk.outputs.ref }}'
      - name: The pinned SDK commit must be on the SDK's main
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          status=$(gh api "repos/MakersBrain/mb-printer-sdk/compare/main...${{ steps.sdk.outputs.ref }}" --jq .status)
          case "$status" in
            identical|behind) echo "SDK pin is on main ($status)." ;;
            *) echo "::error::.github/sdk-ref names a commit that is not on mb-printer-sdk main ($status). Merge the SDK change first, then run npm run sdk:pin."; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-ui, path: mb-ui }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.98.0, targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: mb-printer-sdk/crates/mb-printer-wasm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Create Pages artifact
        run: tar --dereference --hard-dereference --directory apps/pwa/dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
