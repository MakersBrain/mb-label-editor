name: Release package
on:
  push:
    tags: ['v*']
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mb-label-editor } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: mb-label-editor }
      - id: sdk
        # The editor builds against a merged SDK commit, never a moving branch,
        # so a change that spans both repositories lands in the SDK first.
        run: echo "ref=$(tr -d '[:space:]' < .github/sdk-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MakersBrain/mb-printer-sdk
          path: mb-printer-sdk
          ref: '${{ steps.sdk.outputs.ref }}'
      - name: The pinned SDK commit must be on the SDK's main
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          status=$(gh api "repos/MakersBrain/mb-printer-sdk/compare/main...${{ steps.sdk.outputs.ref }}" --jq .status)
          case "$status" in
            identical|behind) echo "SDK pin is on main ($status)." ;;
            *) echo "::error::.github/sdk-ref names a commit that is not on mb-printer-sdk main ($status). Merge the SDK change first, then run npm run sdk:pin."; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-ui, path: mb-ui }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.92.0, targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - name: Locate hosted-runner Chrome
        id: chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
      - run: npm ci && npm run build
        working-directory: mb-printer-sdk/crates/mb-printer-wasm
      - run: npm ci
      - run: npm run check:workflows
      - run: npm run release:candidate
        env:
          RELEASE_TAG: '${{ github.ref_name }}'
          CHROMIUM_PATH: '${{ steps.chrome.outputs.chrome-path }}'
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: { subject-path: 'mb-label-editor/release-artifacts/*' }
      - run: npm publish "release-artifacts/makersbrain-label-editor-$(node -p "require('./packages/label-editor/package.json').version").tgz" --access public --provenance
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: mb-label-editor/release-artifacts/
      - run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes --verify-tag
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
