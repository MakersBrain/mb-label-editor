# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release package
on:
  push:
    tags: ['v*']
permissions: { contents: write, packages: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mb-label-editor } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: mb-label-editor }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-printer-sdk, path: mb-printer-sdk }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, registry-url: 'https://npm.pkg.github.com', scope: '@makersbrain' }
      - run: npm ci && npm run build
        working-directory: mb-printer-sdk/crates/mb-printer-wasm
      - run: npm ci
      - name: Verify tag and package versions
        run: |
          version="$(node -p "require('./packages/label-editor/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./apps/pwa/package.json').version")" = "$version"
      - run: npm run check && npm test && npm run build && npm run check:licenses
      - run: npm pack --workspace @makersbrain/label-editor --json > package-pack.json
      - run: sha256sum *.tgz > SHA256SUMS
      - run: find apps/pwa/dist -type f -print0 | sort -z | xargs -0 sha256sum > PWA-SHA256SUMS
      - run: npm sbom --workspace @makersbrain/label-editor --sbom-format cyclonedx > label-editor-sbom.json
      - run: npm publish --workspace @makersbrain/label-editor
        env: { NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            mb-label-editor/package-pack.json
            mb-label-editor/SHA256SUMS
            mb-label-editor/PWA-SHA256SUMS
            mb-label-editor/label-editor-sbom.json
      - run: gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS PWA-SHA256SUMS label-editor-sbom.json --generate-notes
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
