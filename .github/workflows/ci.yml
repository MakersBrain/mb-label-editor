# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mb-label-editor } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: mb-label-editor }
      - id: sdk
        # The editor builds against a merged SDK commit, never a moving branch,
        # so a change that spans both repositories lands in the SDK first.
        run: echo "ref=$(tr -d '[:space:]' < .github/sdk-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MakersBrain/mb-printer-sdk
          path: mb-printer-sdk
          ref: '${{ steps.sdk.outputs.ref }}'
      - name: The pinned SDK commit must be on the SDK's main
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          status=$(gh api "repos/MakersBrain/mb-printer-sdk/compare/main...${{ steps.sdk.outputs.ref }}" --jq .status)
          case "$status" in
            identical|behind) echo "SDK pin is on main ($status)." ;;
            *) echo "::error::.github/sdk-ref names a commit that is not on mb-printer-sdk main ($status). Merge the SDK change first, then run npm run sdk:pin."; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-printer-cli, path: mb-printer-cli }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-ui, path: mb-ui }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.98.0, targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mb-label-editor/package-lock.json
            mb-printer-sdk/crates/mb-printer-wasm/package-lock.json
      - run: npm ci && npm run build
        working-directory: mb-printer-sdk/crates/mb-printer-wasm
      - run: npm ci
      - run: npm run check
      - run: npm run check:runes
      - run: npm run check:breakpoints
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:workflows
      - run: npm run check:licenses
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: browser-test-results, path: mb-label-editor/test-results, if-no-files-found: ignore }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: label-editor-pwa, path: mb-label-editor/apps/pwa/dist }
