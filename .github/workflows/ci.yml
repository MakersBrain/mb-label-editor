# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mb-label-editor } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: mb-label-editor }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-printer-sdk, path: mb-printer-sdk }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MakersBrain/mb-printer-cli, path: mb-printer-cli }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.92.0, targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mb-label-editor/package-lock.json
            mb-printer-sdk/crates/mb-printer-wasm/package-lock.json
      - run: npm ci && npm run build
        working-directory: mb-printer-sdk/crates/mb-printer-wasm
      - run: npm ci
      - run: npm run check
      - run: npm run check:workflows
      - run: npm run check:licenses
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: label-editor-pwa, path: mb-label-editor/apps/pwa/dist }
