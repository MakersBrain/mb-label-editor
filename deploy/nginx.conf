server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        add_header Permissions-Policy "local-network=(self), loopback-network=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    # Keep the browser-facing asset catalogue on the editor origin. The ^~
    # prevents font/image file URLs below /v1/ from falling into the immutable
    # static-file regex locations below.
    location ^~ /v1/ {
        proxy_pass http://asset-catalog:8766;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:js|css|woff2|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
