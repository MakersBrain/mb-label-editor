# Rendered by the nginx image entrypoint from /etc/nginx/templates; only
# ${ASSET_CATALOG_PROXY_AUTHORIZATION} is substituted (see NGINX_ENVSUBST_FILTER).

# Cloudflare Access sets this header on every request it has authenticated. When
# the container holds the catalogue key, such requests get it injected unless the
# browser already sent its own bearer token. Requests without the Access header,
# for example direct loopback calls, keep the catalogue's own 401.
map $http_cf_access_authenticated_user_email $asset_catalog_injected_authorization {
    default "${ASSET_CATALOG_PROXY_AUTHORIZATION}";
    ""      "";
}
map $http_authorization $asset_catalog_authorization {
    default $http_authorization;
    ""      $asset_catalog_injected_authorization;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        add_header Permissions-Policy "local-network=(self), loopback-network=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    # Keep the browser-facing asset catalogue on the editor origin. The ^~
    # prevents font/image file URLs below /v1/ from falling into the immutable
    # static-file regex locations below.
    location ^~ /v1/ {
        proxy_pass http://asset-catalog:8766;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_set_header Authorization $asset_catalog_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:js|css|woff2|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
